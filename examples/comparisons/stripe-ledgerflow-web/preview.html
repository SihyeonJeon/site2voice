<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LedgerFlow Web Comparison</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101727;
      color: #f7f8fb;
    }
    header {
      max-width: 1280px;
      margin: 0 auto;
      padding: 26px 22px 18px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: end;
    }
    h1 { margin: 0; font-size: 26px; letter-spacing: 0; }
    p { margin: 8px 0 0; color: #b9c2d0; }
    .grid {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 22px 28px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    .frame {
      overflow: hidden;
      border: 1px solid #2d3a50;
      border-radius: 8px;
      background: white;
    }
    .label {
      padding: 12px 14px;
      background: #172033;
      border-bottom: 1px solid #2d3a50;
      font-size: 14px;
      font-weight: 760;
    }
    iframe {
      width: 100%;
      height: 760px;
      border: 0;
      background: white;
    }
    @media (max-width: 900px) {
      header { align-items: start; flex-direction: column; }
      .grid { grid-template-columns: 1fr; }
      iframe { height: 720px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Same prompt, different context</h1>
      <p>Left: no context. Right: Stripe SITE.md + VOICE.md as reference-only context.</p>
    </div>
  </header>
  <main class="grid">
    <section class="frame">
      <div class="label">Without SITE.md / VOICE.md</div>
      <iframe src="without-context.html" title="Without context"></iframe>
    </section>
    <section class="frame">
      <div class="label">With SITE.md / VOICE.md</div>
      <iframe src="with-site-voice.html" title="With site and voice context"></iframe>
    </section>
  </main>
</body>
</html>
