[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "site2voice"
version = "0.5.6"
description = "Ready-to-use SITE.md and VOICE.md context packs for AI-generated web structure and copy."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Sihyeon Jeon"}]
keywords = ["agents", "context-engineering", "site-md", "voice-md", "copywriting", "benchmark", "markdown"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Text Processing :: Markup :: HTML",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/SihyeonJeon/site-voice-packs"
Repository = "https://github.com/SihyeonJeon/site-voice-packs"
Issues = "https://github.com/SihyeonJeon/site-voice-packs/issues"
Changelog = "https://github.com/SihyeonJeon/site-voice-packs/blob/main/CHANGELOG.md"

[project.scripts]
site2voice = "site2voice.cli:main"
site-voice-packs = "site2voice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
