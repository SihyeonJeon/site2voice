name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests
      - run: site2voice examples/saas-home.html --out /tmp/VOICE.md
      - run: site2voice init examples/editorial-home.html --dir /tmp/site2voice-context --no-samples
      - run: site2voice bench examples/editorial-home.html examples/after-copy.md --strict
      - run: site2voice webfit --voice packs/stripe/voice.json --site packs/stripe/site.json --min-delta 20 --min-copy-safety 95 --max-mimic-risk 5 examples/comparisons/stripe-ledgerflow-web/without-context.html examples/comparisons/stripe-ledgerflow-web/with-site-voice.html

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
